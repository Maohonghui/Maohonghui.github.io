# The Site Configuration

theme: jekyll-theme-chirpy

lang: zh-CN

timezone: Asia/Shanghai

title: "我的个人博客"

tagline: "记录与分享"

description: >-
  基于 GitHub Pages 和 Chirpy 搭建的个人主页。

url: "https://maohonghui.github.io"

github:
  username: Maohonghui

twitter:
  username:

social:
  name: Tony
  email:
  links:
    - https://github.com/Maohonghui

# Site Verification Settings
webmaster_verifications:
  google:
  bing:
  baidu:

analytics:
  google:
    id:

pageviews:
  provider:

theme_mode: light

cdn:

avatar: "https://github.com/Maohonghui.png"

social_preview_image:

toc: true

actions:
  edit_post:
    enabled: false
    url: ""
    static_url: false

comments:
  provider: giscus
  disqus:
    shortname:
  utterances:
    repo:
    issue_term:
  giscus:
    repo: "Maohonghui/Maohonghui.github.io"
    repo_id: "R_kgDOU_xPBQ"
    category: "Announcements"
    category_id: "DIC_kwDOU_xPBc4DHRU-"
    mapping: "pathname"
    strict: "0"
    input_position: "bottom"
    lang: "zh-CN"
    reactions_enabled: "1"

assets:
  self_host:
    enabled:

pwa:
  enabled: true
  cache:
    enabled: true

paginate: 10

baseurl: ""

# ------------ The following options are not recommended to be modified ------------------

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
