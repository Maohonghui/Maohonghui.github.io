# The Site Configuration

theme: jekyll-theme-chirpy

lang: zh-CN

timezone: Asia/Shanghai

title: "我的个人博客"

tagline: "记录与分享"

description: "记录与分享，一个用于存放笔记与想法的个人空间。"

url: "https://maohonghui.github.io"

github:
  username: Maohonghui

twitter:
  username:

social:
  name: Tony
  email:
  links:
    - https://github.com/Maohonghui

# Site Verification Settings
webmaster_verifications:
  google:
  bing:
  baidu:

analytics:
  google:
    id:

pageviews:
  provider:

theme_mode: light

cdn:

# 头像：把图片放进 assets/img/ 后改成 "/assets/img/你的图片.png"
# 用绝对路径（以 / 开头）时 Chirpy 不会额外拼接 baseurl，最可靠。
avatar: "/assets/img/avatar.png"

social_preview_image:

toc: true

actions:
  edit_post:
    enabled: false
    url: ""
    static_url: false

comments:
  provider: giscus
  disqus:
    shortname:
  utterances:
    repo:
    issue_term:
  giscus:
    repo: "Maohonghui/Maohonghui.github.io"
    repo_id: "R_kgDOU_xPBQ"
    category: "Announcements"
    category_id: "DIC_kwDOU_xPBc4DHRU-"
    mapping: "pathname"
    strict: "0"
    input_position: "bottom"
    lang: "zh-CN"
    reactions_enabled: "1"

assets:
  self_host:
    enabled:

# ── PWA / Service Worker ────────────────────────────────────────────────────
# cache.enabled: true 会让 Chirpy 注册一个 Cache-First 的 Service Worker
# （sw.min.js）。它会缓存首页和所有静态资源，导致"Ctrl+F5 之后是好的，
# 一点站内链接又变回旧的"这种现象。
#
# cache.enabled: false 时 app.js 会走 unregister 分支，自动注销所有旧的
# Service Worker，从根上解决缓存陈旧问题。个人博客不需要离线浏览，建议保持 false。
pwa:
  enabled: false
  cache:
    enabled: false

paginate: 10

baseurl: ""

# ── 早睡打卡热力图 ──────────────────────────────────────────────────────────
# 数据来自仓库根目录的 sleep-log.md，那篇笔记由手机 Obsidian 直接发布过来，
# 由 _plugins/sleep_log.rb 在构建时解析。
sleep_log:
  file: sleep-log.md      # 打卡笔记在仓库里的路径
  days: 91                # 热力图统计多少天（13 周）
  threshold: "23:00"      # 几点之前入睡算「早睡」

# ------------ The following options are not recommended to be modified ------------------

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      license: false
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - obsidian
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
