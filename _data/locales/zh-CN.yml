# The layout text of site
#
# 这个文件覆盖主题自带的 _data/locales/zh-CN.yml（同名文件会整个替换主题的版本）。
# 改这个文件时要保留主题原有的键，否则对应的界面文字会变空白。

# ----- Commons label -----

layout:
  post: 文章
  category: 分类
  tag: 标签

# The tabs of sidebar
# format: <文件名不带扩展名>: <显示文字>
tabs:
  home: 首页
  categories: 分类
  tags: 标签
  archives: 归档
  about: 关于
  # 自建的「早睡」打卡页（_tabs/sleep.md）。
  # 没有这一行的话，那个页面的浏览器标题会变成空的。
  sleep: 早睡

# the text displayed in the search bar & search results
search:
  hint: 搜索
  cancel: 取消
  no_results: 搜索结果为空

panel:
  lastmod: 最近更新
  trending_tags: 热门标签
  toc: 文章内容

copyright:
  # Shown at the bottom of the post
  #
  # template 留空 = 不再在文章底部显示「本文由作者按照 CC BY 4.0 进行授权」。
  # 这一行是移除授权声明的关键；name / link 保留着不影响。
  license:
    template:
    name: CC BY 4.0
    link: https://creativecommons.org/licenses/by/4.0/

  # Displayed in the footer
  brief:
  verbose:

meta: 本站采用 :PLATFORM 主题 :THEME

not_found:
  statement: 抱歉，我们放错了该 URL，或者它指向了不存在的内容。

notification:
  update_found: 发现新内容
  update: 更新

theme:
  light: 浅色
  dark: 深色
  system: 跟随系统

# ----- Posts related labels -----

post:
  written_by: 作者
  posted: 发表于
  updated: 更新于
  words: 字
  pageview_measure: 次浏览
  read_time:
    unit: 分钟
    prompt: 阅读
  edit: 编辑此文
  relate_posts: 相关文章
  share: 分享
  button:
    next: 下一篇
    previous: 上一篇
    copy_code:
      succeed: 已复制！
    share_link:
      title: 分享链接
      succeed: 链接已复制！

# Date time format.
# See: <http://strftime.net/>, <https://day.js.org/docs/en/display/format>
df:
  post:
    strftime: "%Y/%m/%d"
    dayjs: "YYYY/MM/DD"

# categories page
categories:
  category_measure: 个分类
  post_measure: 篇文章
